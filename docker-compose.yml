services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local-container
      RAG_MODE: ${RAG_MODE:-local}
      KNOWLEDGE_DIR: /app/docs/knowledge-finance
      AUTH_MODE: ${AUTH_MODE:-disabled}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-replace-with-at-least-32-random-characters}
      MEMORY_DB_PATH: /app/output/memory/conversation-memory.sqlite3
      FEEDBACK_DB_PATH: /app/output/feedback/feedback.sqlite3
      JSON_LOGS: "true"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    volumes:
      - rag-output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: ["observability"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-observability-only
    volumes:
      - ./infra/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"

volumes:
  rag-output:
